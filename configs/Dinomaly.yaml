data :
  input_size:
    - 252
    - 252
  image_size: 252
  BATCH_SIZE: 16
  TEST_BATCH_SIZE: 16
  NUM_EPOCHS: 300
  LOG_INTERVAL: 10
  EVAL_INTERVAL: 10
  CHECKPOINT_INTERVAL: 10

model:
  encoder: dinov2reg_vit_base_14
  OPTIMIZER: StableAdamW
  LR: 2e-3
  WEIGHT_DECAY: 0.0001
  scheduler:
    base_value: 2e-3
    final_value: 2e-4
    warmup_iters: 100